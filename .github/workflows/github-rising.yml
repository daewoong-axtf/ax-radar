name: github-rising

# 흐름 (KST)
#   매일 06:00    snapshot  후보 저장소 별 수 기록
#   월요일 07:00  report    순위 계산 + 페이지 갱신 (summary.mode=claude-task면 알림 보류)
#   월요일 08:40  Claude 예약 작업이 한국어 요약을 채워 push → 이 워크플로가 publish로 알림 발송
#   월요일 11:00  publish   요약이 안 왔어도 알림 발송 (이미 보냈으면 아무것도 안 함)

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST
    - cron: "0 22 * * 0"   # 월 07:00 KST
    - cron: "0 2 * * 1"    # 월 11:00 KST
  push:
    branches: [main]
    paths: ["data/github_rising/reports/**"]
  workflow_dispatch:
    inputs:
      command:
        description: "실행할 명령"
        default: report
        type: choice
        options: [report, snapshot, publish, resend, site]
      notify:
        description: "Slack/Discord/웹훅으로 보내기"
        default: true
        type: boolean
      as_of:
        description: "report만: 지난 주 리포트 날짜 (YYYY-MM-DD, 비우면 이번 주)"
        required: false
        default: ""
      fresh:
        description: "report만: 오늘 스냅샷을 새로 찍기"
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ax-radar-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "anthropic>=0.80"   # summary.mode = "api"일 때만 쓰여요
      - name: Pick command
        id: pick
        run: |
          FLAGS=""
          case "${{ github.event_name }}" in
            workflow_dispatch)
              CMD="${{ inputs.command }}"
              [ "${{ inputs.notify }}" = "true" ] || FLAGS="--no-notify"
              [ -z "${{ inputs.as_of }}" ] || FLAGS="$FLAGS --as-of ${{ inputs.as_of }}"
              [ "${{ inputs.fresh }}" != "true" ] || FLAGS="$FLAGS --fresh" ;;
            push) CMD=publish ;;
            schedule)
              case "${{ github.event.schedule }}" in
                "0 22 * * 0") CMD=report ;;
                "0 2 * * 1")  CMD=publish ;;
                *)            CMD=snapshot ;;
              esac ;;
          esac
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"
      - name: Run
        env:
          # GH_PAT(개인 토큰)이 있으면 5,000회/시간, 없으면 기본 토큰(1,000회/시간)
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GENERIC_WEBHOOK_URL: ${{ secrets.GENERIC_WEBHOOK_URL }}
          # 슬랙의 "전체 리포트 보기" 링크 (비우면 github.io 리포트 페이지)
          REPORT_LINK_URL: ${{ secrets.REPORT_LINK_URL }}
        run: python -m radar github_rising ${{ steps.pick.outputs.cmd }} ${{ steps.pick.outputs.flags }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if ! git diff --cached --quiet; then
            git commit -m "radar: github_rising ${{ steps.pick.outputs.cmd }} $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
      - name: Build site
        if: steps.pick.outputs.cmd == 'snapshot'
        run: python -m radar github_rising site
      - uses: actions/configure-pages@v5
        id: pages
        continue-on-error: true   # Pages를 아직 안 켰으면 배포만 건너뛰어요
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: public
      - uses: actions/deploy-pages@v4
        if: steps.pages.outcome == 'success'
