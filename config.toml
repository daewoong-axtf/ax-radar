# ax-radar 설정
# 공통 섹션: summary, notify / 소스별 섹션: github_rising.* (소스를 추가하면 <소스이름>.* 로 늘어나요)

[github_rising.report]
top_n = 10                 # 순위표에 올릴 개수
window_days = 7            # 별 증가를 세는 기간 (일)
title_prefix = "GitHub 별 급상승 AI·개발 도구"
timezone_offset_hours = 9  # KST

[github_rising.discovery]
# 후보를 찾는 GitHub 검색 쿼리. {since_7d}, {since_30d}, {since_90d} 는 날짜(YYYY-MM-DD)로 바뀌어요.
# 쿼리 1개당 검색 API 1~2회 (최대 200개) 를 써요. 검색 한도는 토큰 기준 30회/분이에요.
queries = [
  "created:>{since_30d} stars:>150",
  "created:>{since_90d} stars:>800",
  "topic:ai-agents stars:>300 pushed:>{since_7d}",
  "topic:agents stars:>300 pushed:>{since_7d}",
  "topic:llm stars:>1000 pushed:>{since_7d}",
  "topic:mcp stars:>300 pushed:>{since_7d}",
  "topic:model-context-protocol stars:>300 pushed:>{since_7d}",
  "topic:claude-code stars:>200 pushed:>{since_7d}",
  "topic:ai-coding stars:>200 pushed:>{since_7d}",
  "topic:rag stars:>1000 pushed:>{since_7d}",
  "topic:generative-ai stars:>1000 pushed:>{since_7d}",
  # 2026-11-23 추가: 표기만 다른 에이전트·스킬·코딩 에이전트·MCP 토픽
  "topic:agent-skills stars:>200 pushed:>{since_7d}",
  "topic:skills stars:>500 pushed:>{since_7d}",
  "topic:agentic-ai stars:>300 pushed:>{since_7d}",
  "topic:multi-agent stars:>300 pushed:>{since_7d}",
  "topic:coding-agent stars:>200 pushed:>{since_7d}",
  "topic:codex stars:>300 pushed:>{since_7d}",
  "topic:cursor stars:>500 pushed:>{since_7d}",
  "topic:copilot stars:>500 pushed:>{since_7d}",
  "topic:mcp-server stars:>300 pushed:>{since_7d}",
  # 검색 증강·프롬프트·운영·로컬 실행
  "topic:vector-database stars:>1000 pushed:>{since_7d}",
  "topic:embeddings stars:>1000 pushed:>{since_7d}",
  "topic:prompt-engineering stars:>500 pushed:>{since_7d}",
  "topic:context-engineering stars:>200 pushed:>{since_7d}",
  "topic:llmops stars:>500 pushed:>{since_7d}",
  "topic:evals stars:>500 pushed:>{since_7d}",
  "topic:ai-observability stars:>300 pushed:>{since_7d}",
  "topic:local-llm stars:>500 pushed:>{since_7d}",
  "topic:ollama stars:>1000 pushed:>{since_7d}",
  "topic:inference stars:>1000 pushed:>{since_7d}",
  # 범위가 넓은 토픽은 별 3천 개 이상만
  "topic:ai stars:>3000 pushed:>{since_7d}",
]
pages_per_query = 1        # 1페이지 = 100개
keep_tracking_days = 35    # 한 번 후보가 된 레포는 이 기간 동안 매일 스냅샷에 포함돼요

[github_rising.discovery.trending]
# GitHub Trending 페이지(github.com/trending)에 오른 레포도 매일 후보에 넣어요.
# 토픽이 없거나 오래된 레포도 뜨는 순간 잡혀요. 순위·별 증가는 여전히 우리가 직접 세요.
# 공식 API가 없어 HTML을 읽어요. 페이지 구조가 바뀌면 이 부분만 건너뛰고 나머지는 계속 돌아요.
enabled = true
periods = ["daily", "weekly"]
languages = ["", "python", "typescript", "javascript", "rust", "go"]   # "" = 전체 언어

[github_rising.filter]
# true면 이름·설명·토픽에 아래 키워드가 있는 레포만 순위에 올려요.
ai_only = true
keywords = [
  "ai", "agent", "agents", "agentic", "llm", "llms", "gpt", "claude", "gemini", "openai",
  "anthropic", "mcp", "model context protocol", "rag", "copilot", "coding assistant",
  "language model", "transformer", "diffusion", "inference", "prompt", "embedding",
  "vector", "chatbot", "deepseek", "qwen", "llama", "mistral", "ml", "machine learning",
  "multimodal", "vlm", "speech", "tts", "asr", "fine-tun", "lora", "vibe coding",
  "codex", "ollama",
]
min_forks = 5              # 포크가 이보다 적으면 제외 (가짜 스타 스팸 방지)
min_stars = 100
exclude = [                 # 영구 제외할 저장소 (owner/name)
]
# 별 대비 포크 비율이 이보다 낮으면 "가짜 스타 의심" 경고를 달아요 (제외는 안 해요).
suspicious_fork_ratio = 0.01

[github_rising.scope]
# 순위(Top 10)에 올리는 범위: AI/LLM과 개발 도구만. 수집은 넓게 하고, 순위 단계에서만 걸러요.
# 걸린 저장소는 리포트 아래 "제외한 곳"에 이유와 함께 남아요.
# 이름(owner/ 뒤)을 단어로 나눈 것과 토픽은 words로, 설명은 phrases로 비교해요.
# 규칙으로 못 거른 것은 매주 Claude 예약 작업이 README를 읽고 "exclude"로 빼요 (docs/claude-weekly-task.md).
enabled = true
reserve = 10      # Top 10 다음 순위 저장소를 이만큼 예비로 저장해 두고, 빠진 자리를 채워요
include = []      # 규칙에 걸려도 순위에 올릴 저장소 (owner/name)

# name_words: 저장소 이름(owner/ 뒤)을 -·_ 로 나눈 단어, topics: GitHub 토픽, phrases: 설명에 들어간 문구.
# unless_topics: 이 토픽이 있으면 이 규칙을 적용하지 않아요 (예: 블렌더용 MCP 서버는 "MCP 서버"라서 순위에 올려요).

[[github_rising.scope.rules]]
reason = "창작·디자인 도구"
name_words = ["blender", "photoshop", "illustrator", "premiere", "aftereffects"]
topics = ["blender", "blender-addon", "photoshop", "illustrator", "after-effects", "3d-printing", "music-production"]
phrases = ["blender add-on", "blender addon"]
unless_topics = ["mcp", "mcp-server", "model-context-protocol", "agent-skills"]

[[github_rising.scope.rules]]
reason = "게임·일반 사용자용 앱"
name_words = ["game", "games", "minecraft", "roblox", "anime", "manga", "wallpaper"]
topics = ["game", "games", "minecraft", "roblox", "anime", "manga", "music-player", "video-player", "iptv"]
phrases = []
unless_topics = ["mcp", "mcp-server", "model-context-protocol"]

[[github_rising.scope.rules]]
reason = "강의·자료·링크 모음"
name_words = ["awesome", "interview", "tutorial", "tutorials", "course", "courses", "roadmap", "cheatsheet",
              "leetcode", "howto"]
topics = ["awesome", "awesome-list", "awesome-lists", "course", "courses", "learning-resources", "roadmap", "cheatsheet"]
phrases = ["curated list", "awesome list", "interview questions", "free courses", "collection of resources"]

[github_rising.bootstrap]
# 7일 전 스냅샷이 없을 때(첫 주, 지난 주 채우기)는 별 증가를 다른 곳에서 세요.
# 1순위: 공개 GH Archive 데이터(ClickHouse, 토큰 불필요). 안 되면 2순위: stargazers API.
enabled = true
gharchive = true
max_pages_per_repo = 40    # 1페이지=100개. 4,000개 넘게 오른 레포는 "4,000+"로 표시돼요
max_repos = 250            # 비용 제한: 하루 평균 별 증가가 큰 순으로 이 개수까지만 세요

[summary]
# 한국어 "한 줄 / 단, 확인할 것 / 설치 한 줄"을 누가 쓸지 정해요.
#  "claude-task": API 키 없이. 리포트는 알림 없이 저장되고, 매주 Claude 예약 작업이 요약을 채워 push하면
#                 그때 페이지·RSS·Slack이 나가요. 요약이 11:00 KST까지 안 오면 설명만으로 그냥 보내요.
#  "api":         ANTHROPIC_API_KEY로 리포트를 만들 때 바로 요약하고 바로 알림을 보내요.
#  "off":         요약 없이 저장소 설명만 써서 바로 알림을 보내요.
mode = "claude-task"
model = "claude-opus-5-5"
readme_max_chars = 12000   # README 앞부분만 보내요 (한 줄 요약용이라 충분해요)

[notify]
# 비밀값은 환경변수로 넣어요: SLACK_WEBHOOK_URL, DISCORD_WEBHOOK_URL, GENERIC_WEBHOOK_URL
# 소스별로 다른 채널에 보내려면 뒤에 _<소스이름 대문자>를 붙여요. 예: SLACK_WEBHOOK_URL_GITHUB_RISING
slack = true
discord = true
generic_webhook = true

[site]
# GitHub Pages 주소. 알림·RSS 안의 링크에 써요. (Settings → Pages → Source: GitHub Actions)
base_url = "https://daewoong-axtf.github.io/ax-radar"
# 슬랙 "전체 리포트 보기" 링크. 저장소 비밀값 REPORT_LINK_URL이 있으면 그걸 먼저 써요. 비우면 github.io 리포트 페이지예요.
report_link = "https://app.notion.com/p/GitHub-AI-4213d273ae9b80a0a706d15aa7de1641"
